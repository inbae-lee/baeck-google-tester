<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google OAuth Tester</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="card">
      <div id="signed-out" class="state">
        <h1>Google OAuth Tester</h1>
        <p class="muted">Sign in to test the flow.</p>
        <div id="g_id_signin"></div>
        <p id="verify-error" class="warning hidden"></p>
      </div>

      <div id="signed-in" class="state hidden">
        <p class="success">Success!</p>
        <p class="muted" id="user-email"></p>
        <button id="logout-button" type="button">Log out</button>
      </div>

      <p id="config-warning" class="warning hidden">
        Set <code>GOOGLE_CLIENT_ID</code> and <code>BACKEND_VERIFY_URL</code>
        in <code>config.js</code> before this will work.
      </p>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
